[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LiteLlmRTKSync"
version = "1.0.0"
description = "LiteLLM virtual key, credential and rate-limit synchronizer"
readme = "README.md"
authors = [
    { name = "Eliel Sousa", email = "eliel@pathbit.co" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["litellm", "llm-proxy", "virtual-keys", "rate-limit", "credential-check"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

# OIDC nao aparece aqui de proposito: ele sai inteiro com a biblioteca padrao
# (urllib, hashlib, hmac, secrets, base64), e nao ha dependencia a declarar.
#
# SAML2 exige dependencia externa, e nao ha versao honesta com a biblioteca
# padrao: `xml.etree.canonicalize` implementa C14N 2.0 e o SAML assina sobre
# exclusive c14n 1.0; nao ha verificacao RSA na biblioteca padrao; e defender-se
# de XML Signature Wrapping exige amarrar a referencia da assinatura ao elemento
# efetivamente lido. Fica como extra, importado de forma preguicosa: quem so
# quer OIDC nao carrega nada, e sem a biblioteca a aba SAML da tela aparece
# desabilitada em vez de o painel quebrar.
[project.optional-dependencies]
saml = ["python3-saml>=1.16"]
test = [
    "docker>=7.0.0",
    "testcontainers>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/pathbit/LiteLlmRTKSync"
Repository = "https://github.com/pathbit/LiteLlmRTKSync"
Issues = "https://github.com/pathbit/LiteLlmRTKSync/issues"

[project.scripts]
litellmrtksync = "litellm_rtksync.cli:main"
litellm-rtksync = "litellm_rtksync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# A suite deste repositorio mora em tests/, e so ali. Sem esta linha o
# `python3 -m pytest` varre o diretorio inteiro e tenta coletar o clone do
# upstream em tmp/litellm -- centenas de erros de import de um projeto que nao e
# este, e a suite daqui nem chega a rodar.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
