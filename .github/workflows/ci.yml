name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create and activate virtual environment
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run unit test suite
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -p "test_*.py"

      - name: Test package install
        run: |
          pip install --upgrade pip
          pip install .
          litellmrtksync --help
          LiteLlmRTKSync --help

  docker-validation:
    name: Validate Docker Image Build & Testcontainers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create and activate virtual environment
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install package with test extras
        run: |
          pip install --upgrade pip
          pip install ".[test]"

      - name: Build Docker image (validate no build error)
        run: |
          docker build -t litellmrtksync:test .

      - name: Validate container with Testcontainers
        env:
          TEST_DOCKER_IMAGE: litellmrtksync:test
        run: |
          PYTHONPATH=src python3 -m unittest tests/test_container.py -v
