# Nome da stack no padrao das outras duas deste repositorio
# (litellmrtksync-stack, litellmrtksync-test): o prefixo litellmrtk- e o dos
# containers, nao o das stacks.
name: litellmrtksync-egress

# Bancada para testar POR ONDE o trafego sai.
#
# A pergunta que ela responde e uma so, e nao da para responder por leitura de
# codigo: quando uma conta esta vinculada a um proxy, a requisicao sai mesmo por
# ele? E quando esse proxy cai, o gateway falha -- ou sai direto, pelo IP da
# maquina, com o token da conta?
#
# Nada aqui toca a internet. O destino e um servidor local que devolve o IP de
# origem que enxergou, entao a resposta e verificavel e nao depende de servico
# de terceiro nem de sorte de rede.
#
#   docker compose -f docker-compose.egress-test.yml up -d
#   tools/testa_saida_de_rede.sh
#   docker compose -f docker-compose.egress-test.yml down -v

services:
  # Dois proxies, nao um: com um so nao da para distinguir "saiu pelo proxy" de
  # "saiu por qualquer proxy". Com dois, cada conta tem o seu, e o teste mostra
  # se o vinculo por conta realmente separa as saidas.
  proxy-a:
    image: ubuntu/squid:latest
    container_name: litellmrtk-proxy-a
    restart: unless-stopped
    ports:
      - "127.0.0.1:18101:3128"
    networks:
      egress:
        ipv4_address: 172.33.0.11
    healthcheck:
      # O que importa e a porta aceitar conexao: squidclient nao existe nesta
      # imagem, e um healthcheck que depende de binario ausente fica eternamente
      # "starting" sem que nada esteja errado.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/3128' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy-b:
    image: ubuntu/squid:latest
    container_name: litellmrtk-proxy-b
    restart: unless-stopped
    ports:
      - "127.0.0.1:18102:3128"
    networks:
      egress:
        ipv4_address: 172.33.0.12
    healthcheck:
      # O que importa e a porta aceitar conexao: squidclient nao existe nesta
      # imagem, e um healthcheck que depende de binario ausente fica eternamente
      # "starting" sem que nada esteja errado.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/3128' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Destino: devolve, em JSON, o endereco de origem que enxergou. E o arbitro do
  # teste -- e ele quem diz se a requisicao chegou pelo proxy A, pelo B ou
  # direto da maquina.
  echo:
    image: python:3.12-alpine
    container_name: litellmrtk-echo
    restart: unless-stopped
    ports:
      - "127.0.0.1:18100:8080"
    networks:
      egress:
        ipv4_address: 172.33.0.20
    command:
      - python3
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Echo(BaseHTTPRequestHandler):
            def do_GET(self):
                corpo = json.dumps({
                    "seen_from": self.client_address[0],
                    "path": self.path,
                    "via": self.headers.get("Via", ""),
                    "forwarded_for": self.headers.get("X-Forwarded-For", ""),
                }).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(corpo)))
                self.end_headers()
                self.wfile.write(corpo)

            def log_message(self, *a):
                pass

        ThreadingHTTPServer(("0.0.0.0", 8080), Echo).serve_forever()
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/',timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  egress:
    # Nome explicito, como na rede da stack principal. Sem ele a rede real se
    # chama <nome-do-projeto>_egress, e o comando que a wiki manda rodar para
    # ligar o gateway a bancada quebra em silencio a cada renomeacao da stack.
    name: litellmrtksync-egress-net
    ipam:
      config:
        - subnet: 172.33.0.0/24
